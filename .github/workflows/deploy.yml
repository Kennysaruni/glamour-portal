name: Deploy Glamour Portal to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production EC2
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Docker Image on Runner
        run: |
          echo "=== 1. Building Production Standalone Image on GitHub Runner ==="
          docker build -t glamour-portal:latest .
          echo "=== Docker Image Built Successfully ==="
          docker images glamour-portal:latest

      - name: Deep Clean EC2 Host Disk Space
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ubuntu@${{ secrets.EC2_HOST }} "bash -s" << 'EOF'
            set -e

            echo "=== Initial Disk Space on EC2 ==="
            df -h /

            echo "=== 1. Vacuuming Systemd Journal Logs ==="
            sudo journalctl --vacuum-size=50M --vacuum-time=1d 2>/dev/null || true

            echo "=== 2. Cleaning APT Cache and Orphan Packages ==="
            sudo apt-get clean 2>/dev/null || true
            sudo apt-get autoremove -y 2>/dev/null || true

            echo "=== 3. Purging Temporary Files and Rotated Logs ==="
            sudo rm -rf /tmp/* /var/tmp/* /var/log/*.gz /var/log/*.[0-9] 2>/dev/null || true

            echo "=== 4. Cleaning Dangling Docker Resources & Builder Cache ==="
            docker builder prune -af 2>/dev/null || true
            docker system prune -af --volumes 2>/dev/null || true

            echo "=== 5. Ensuring App Directories Exist ==="
            mkdir -p /home/ubuntu/glamour-portal/public/uploads

            echo "=== Disk Space After EC2 Cleanup ==="
            df -h /
          EOF

      - name: Sync Configuration and Caddyfile to EC2
        run: |
          rsync -avz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.env*' \
            --exclude='*.pem' \
            --exclude='public/uploads' \
            --exclude='dev.db*' \
            --exclude='*.db' \
            -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa" \
            ./ ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/glamour-portal/

      - name: Generate and Transfer Production Environment File
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL || secrets.BETTER_AUTII_URL || 'https://56-228-23-80.sslip.io' }}
          BETTER_AUTH_API_KEY: "ba_ivl9s06c1tmzdk21x6pcw96tynrm3275"
          AWS_REGION: ${{ secrets.AWS_REGION || 'eu-north-1' }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: |
          node scripts/generate-env.js /tmp/.env.production
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa /tmp/.env.production ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/glamour-portal/.env.production
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ubuntu@${{ secrets.EC2_HOST }} "cp /home/ubuntu/glamour-portal/.env.production /home/ubuntu/glamour-portal/.env && chmod 600 /home/ubuntu/glamour-portal/.env.production /home/ubuntu/glamour-portal/.env"
          rm -f /tmp/.env.production

      - name: Stream and Load Docker Image to EC2
        run: |
          echo "=== Streaming Compressed Image to EC2 Docker Daemon ==="
          docker save glamour-portal:latest | gzip -1 | ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ubuntu@${{ secrets.EC2_HOST }} "gzip -dc | docker load"
          echo "=== Docker Image Successfully Loaded on EC2 ==="

      - name: Launch Container and Verify Health on EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ubuntu@${{ secrets.EC2_HOST }} "bash -s" << 'EOF'
            set -e

            echo "=== 1. Updating Caddy SSL & Reverse Proxy Configuration ==="
            if [ -f /home/ubuntu/glamour-portal/Caddyfile ]; then
              sudo cp /home/ubuntu/glamour-portal/Caddyfile /etc/caddy/Caddyfile
              sudo systemctl reload caddy || sudo systemctl restart caddy || true
            fi

            echo "=== 2. Stopping and Removing Previous Container ==="
            docker stop glamour-portal-app 2>/dev/null || true
            docker rm glamour-portal-app 2>/dev/null || true

            echo "=== 3. Launching Container with Restart-Always Policy ==="
            docker run -d \
              --name glamour-portal-app \
              --restart always \
              -p 3000:3000 \
              --env-file /home/ubuntu/glamour-portal/.env.production \
              -v /home/ubuntu/glamour-portal/public/uploads:/app/public/uploads \
              glamour-portal:latest

            echo "=== 4. Cleaning Dangling Old Images ==="
            docker image prune -f 2>/dev/null || true

            echo "=== 5. Verifying Container Status & Health ==="
            sleep 6
            docker ps --filter "name=glamour-portal-app"

            echo "=== 6. Final Disk Status on EC2 ==="
            df -h /

            echo "=== Deployment Successfully Completed ==="
          EOF
