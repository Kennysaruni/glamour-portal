name: Deploy Glamour Portal to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production EC2
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Prepare EC2 Workspace Directory
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ubuntu@${{ secrets.EC2_HOST }} "mkdir -p /home/ubuntu/glamour-portal/public/uploads"

      - name: Sync Source Code to EC2 via SCP / Rsync
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.env' \
            --exclude='.env.local' \
            --exclude='*.pem' \
            -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa" \
            ./ ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/glamour-portal/

      - name: Generate and Transfer Production Environment File
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL || secrets.BETTER_AUTII_URL || 'https://56-228-23-80.sslip.io' }}
          BETTER_AUTH_API_KEY: "ba_ivl9s06c1tmzdk21x6pcw96tynrm3275"
          AWS_REGION: ${{ secrets.AWS_REGION || 'eu-north-1' }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          node -e '
            const fs = require("fs");
            const clean = (val, fallback = "") => {
              if (!val) return fallback;
              const mdMatch = val.match(/\[.*?\]\((.*?)\)/);
              const raw = mdMatch ? mdMatch[1] : val;
              return raw.replace(/^[\s"'\`]+|[\s"'\`]+$/g, "");
            };

            const envLines = [
              `DATABASE_URL=${clean(process.env.DATABASE_URL)}`,
              `BETTER_AUTH_SECRET=${clean(process.env.BETTER_AUTH_SECRET)}`,
              `BETTER_AUTH_URL=${clean(process.env.BETTER_AUTH_URL, "https://56-228-23-80.sslip.io")}`,
              `BETTER_AUTH_API_KEY=${clean(process.env.BETTER_AUTH_API_KEY, "ba_ivl9s06c1tmzdk21x6pcw96tynrm3275")}`,
              `AWS_REGION=${clean(process.env.AWS_REGION, "eu-north-1")}`,
              `AWS_S3_BUCKET=${clean(process.env.AWS_S3_BUCKET)}`,
              `AWS_ACCESS_KEY_ID=${clean(process.env.AWS_ACCESS_KEY_ID)}`,
              `AWS_SECRET_ACCESS_KEY=${clean(process.env.AWS_SECRET_ACCESS_KEY)}`,
              `NODE_ENV=production`,
              `PORT=3000`,
              `HOSTNAME=0.0.0.0`,
            ];
            fs.writeFileSync("/tmp/.env.production", envLines.join("\n") + "\n");
          '

          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa /tmp/.env.production ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/glamour-portal/.env.production
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ubuntu@${{ secrets.EC2_HOST }} "cp /home/ubuntu/glamour-portal/.env.production /home/ubuntu/glamour-portal/.env && chmod 600 /home/ubuntu/glamour-portal/.env.production /home/ubuntu/glamour-portal/.env"
          rm -f /tmp/.env.production

      - name: Build and Restart Docker Container on EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ubuntu@${{ secrets.EC2_HOST }} "bash -s" << 'EOF'
            set -e

            echo "=== 1. Updating Caddy SSL & Reverse Proxy Configuration ==="
            if [ -f /home/ubuntu/glamour-portal/Caddyfile ]; then
              sudo cp /home/ubuntu/glamour-portal/Caddyfile /etc/caddy/Caddyfile
              sudo systemctl reload caddy || sudo systemctl restart caddy || true
            fi

            echo "=== 2. Stopping and Removing Existing Container ==="
            docker stop glamour-portal-app 2>/dev/null || true
            docker rm glamour-portal-app 2>/dev/null || true

            echo "=== 3. Cleaning Dangling Docker Resources ==="
            docker system prune -af || true

            echo "=== 4. Building Fresh Standalone Docker Image ==="
            cd /home/ubuntu/glamour-portal
            docker build -t glamour-portal:latest .

            echo "=== 5. Launching Container with Restart-Always Policy ==="
            docker run -d \
              --name glamour-portal-app \
              --restart always \
              -p 3000:3000 \
              --env-file /home/ubuntu/glamour-portal/.env.production \
              -v /home/ubuntu/glamour-portal/public/uploads:/app/public/uploads \
              glamour-portal:latest

            echo "=== 6. Verifying Container Status & Health ==="
            sleep 6
            docker ps --filter "name=glamour-portal-app"

            echo "=== Deployment Successfully Completed ==="
          EOF
