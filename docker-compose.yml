services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: glamour-portal-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-https://portal.glamourhomecare.org}
      - BETTER_AUTH_API_KEY=${BETTER_AUTH_API_KEY}
      - NODE_ENV=production
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/login"]
      interval: 30s
      timeout: 10s
      retries: 3
